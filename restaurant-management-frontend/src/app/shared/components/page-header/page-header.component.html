<section class="page-header">
  <div class="title-group">
    @if (icon()) {
      <mat-icon class="title-icon">{{ icon() }}</mat-icon>
    }
    <div>
      <h1>{{ title() }}</h1>
      @if (subtitle()) {
        <p>{{ subtitle() }}</p>
      }
    </div>
  </div>

  <div class="actions">
    <ng-content></ng-content>
  </div>
</section>

<mat-divider></mat-divider>
