<div class="page-content">
  <app-page-header
    [title]="'Autenticación'"
    [subtitle]="'Gestiona el acceso del personal y administradores.'"
    [icon]="'lock'"
  >
    <button mat-stroked-button>Recuperar acceso</button>
  </app-page-header>

  <mat-card class="auth-card">
    <mat-card-title>Acceso seguro</mat-card-title>
    <mat-card-content>
      <p>
        Esta sección se conectará con el backend para manejar inicio de sesión, roles y permisos.
      </p>
      <div class="actions">
        <button mat-flat-button color="primary">Iniciar sesión</button>
        <button mat-stroked-button>Registrar usuario</button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
