<div class="page-content">
  <app-page-header
    [title]="'Pedidos'"
    [subtitle]="'Supervisa órdenes, tiempos y montos.'"
    [icon]="'receipt_long'"
  >
    <button mat-flat-button color="primary">Nuevo pedido</button>
    <button mat-stroked-button>Generar reporte</button>
  </app-page-header>

  <div class="page-grid">
    <mat-card>
      <mat-card-title>Resumen</mat-card-title>
      <mat-card-content>
        <div class="summary-item">
          <span>Pedidos hoy</span>
          <strong>58</strong>
        </div>
        <div class="summary-item">
          <span>En preparación</span>
          <strong>12</strong>
        </div>
        <div class="summary-item">
          <span>Completados</span>
          <strong>41</strong>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card>
      <mat-card-title>Estado</mat-card-title>
      <mat-card-content>
        <mat-chip-set>
          <mat-chip color="primary" selected>Abierto</mat-chip>
          <mat-chip>En curso</mat-chip>
          <mat-chip>Cerrado</mat-chip>
        </mat-chip-set>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-card>
    <mat-card-title>Notas</mat-card-title>
    <mat-card-content>
      <p>Conecta la API para listar artículos, totales y notas especiales.</p>
    </mat-card-content>
  </mat-card>
</div>
